context:
  name: openblas
  version: 0.3.35.dev0
  # Pinned develop commit (2026-08-22): picks up jjerphan's WASM SIMD work
  # (4x4 GEMM/TRMM, WASM128 AXPY/GEMV, -mrelaxed-simd) that landed post-v0.3.34.
  commit: 632ef874379c16ca8646d9fa0f6c60449e47d960

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Uses the pinned commit while on .dev0; swaps to the release tag automatically
  # once upstream releases v0.3.35 (requires the version-ticker fix relaxing
  # the linter to accept `version` referenced inside a Jinja block).
  url: https://github.com/OpenMathLib/OpenBLAS/archive/${{ commit if 'dev' in version else 'v' + version }}.tar.gz
  sha256: 1f3e631d8956d20aa38d09b3ae5120f827782c3e2258cb59330fcb020b50df4b
  patches:
  # Patches 0001-0012 rebased from jjerphan/v0.3.34-emforge onto the develop commit.
  # Patches 0013-0014 are new (see OpenMathLib/OpenBLAS#5993, #5996).
  # To regenerate: `git format-patch ${commit}..HEAD` from the rebased branch.
  - patches/0001-Remove-march-flags.patch
  - patches/0002-Skip-linktest.patch
  - patches/0003-Add-emscripten-as-supported-arch.patch
  - patches/0004-Add-dummy-length-arguments-for-char-arguments.patch
  - patches/0005-Return-void-not-int.patch
  - patches/0006-Int-to-void-return-types-of-lapack-functions-used-by.patch
  - patches/0007-Enable-LAPACK_FORTRAN_STDLEN_END-for-lapacke-calling.patch
  - patches/0008-Clear-FEXTRALIB-when-linking-shared-library.patch
  - patches/0009-Skip-fork-based-utests-for-emscripten.patch
  - patches/0010-Run-OpenBLAS-tests-under-node-for-emscripten.patch
  - patches/0011-Return-int-from-ctest-F77-wrappers-for-wasm-ABI.patch
  - patches/0012-Use-int-return-for-f2c-Subroutine-decls-in-ctest.patch
  - patches/0013-wasm-guard-KERNEL-assignments-with-ifndef-so-KERNEL..patch
  - patches/0014-wasm-use-relaxed-simd-madd-for-v_muladd-when-availab.patch

build:
  number: 3

  files:
    exclude:
    - '**/test_*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('fortran') }}
  - cmake
  - make
  - nodejs
  host:
  - libflang >= 20.1

tests:
- package_contents:
    include:
    - cblas.h
    - f77blas.h
    - lapack.h
    - lapacke.h
    - openblas_config.h
    lib:
    - libopenblas.a
    - libopenblas.so
    files:
    - lib/pkgconfig/openblas.pc
- script: pytester
  files:
    recipe:
    - test_openblas.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: http://www.openblas.net/
  repository: https://github.com/OpenMathLib/OpenBLAS
  license: BSD-3-Clause
  license_file: LICENSE
  summary: An optimized BLAS library based on GotoBLAS2 1.13 BSD version

extra:
  maintainers:
  - DerThorsten
  - anutosh491
  - IsabelParedes
  - ianthomas23
  channel: emscripten-forge-4x-experimental
