  build:
    script: build_qtsvg.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - perl
    - python
    - qt6-main == ${{ version }}
    host:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
    run:
    - ${{ pin_subpackage('qt6-main', exact=True) }}
  tests:
  - package_contents:
      files:
      - lib/libQt6Svg.a
      - lib/libQt6SvgWidgets.a
      - lib/cmake/Qt6Svg/Qt6SvgConfig.cmake
