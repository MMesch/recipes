context:
  version: 6.11.2

build:
  number: 0

outputs:
- package:
    name: qt6-main
    version: ${{ version }}
  source:
    url: https://download.qt.io/official_releases/qt/6.11/${{ version }}/submodules/qtbase-everywhere-src-${{ version }}.tar.xz
    sha256: 5b2e00eccaf5a4d8c14134ffa0ea8dfd0a35ae1ffc7f8d87fa4305a1ed23cf22
  build:
    script: build_qtbase.sh
  requirements:
    build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - perl
    - python
    - qt6-main == ${{ version }}
    host:
    - zlib
  tests:
  - package_contents:
      files:
      - bin/qmake6
      - lib/libQt6Core.a
      - lib/libQt6Gui.a
      - lib/libQt6Widgets.a
      - lib/libQt6Xml.a
      - lib/libQt6Network.a
      - lib/cmake/Qt6/Qt6Config.cmake
      - include/QtCore/QString
      - plugins/platforms/libqwasm.a
      - plugins/imageformats/libqjpeg.a
      - plugins/imageformats/libqgif.a
      - plugins/imageformats/libqico.a
  - script:
    - build_tests_qtbase.sh
    requirements:
      build:
      - ${{ compiler('cxx') }}
    files:
      recipe:
      - build_tests_qtbase.sh
  about:
    summary: Qt6 base libraries (Core, Gui, Widgets, Network, Xml) for Emscripten (WASM)
    license_file: LICENSES/LGPL-3.0-only.txt

- package:
